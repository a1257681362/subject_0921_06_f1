server:
  port: 8080

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 不使用 Shiro 注解鉴权（接口暂走 anon/authc 过滤链），关闭其自动代理，
# 避免与事务代理叠加把 Service 二次包装成 JDK 代理导致注入失败
shiro:
  annotations:
    enabled: false

logging:
  level:
    com.evops: INFO
